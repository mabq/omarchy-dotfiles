# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------

# Use:
#   `sudo keyd reload` to reload config files.
#   `sudo keyd monitor` to check key presses and keyboad IDs
#   `journalctl -u keyd -b` to review which devices are managed by keyd.

# ------------------------------------------------------------------------------
# Match devices
# ------------------------------------------------------------------------------

[ids]

# Match all devices identified as keyboards.
# IMPORTANT:
#   All explicit IDs used in this or other `.conf` files take precedence over
#   this wildcard.
*

# Logitech Mx Master 3 is identified as keyboard, so it must be explicitly
# unmatched here. This is important to avoid the stepped scrolling issue.
-046d:4082

# ACPI Video Bus (brightness keys; not a real keyboard)
-0000:0006

# ------------------------------------------------------------------------------
# Configurations to apply
# ------------------------------------------------------------------------------

[main]
include config
